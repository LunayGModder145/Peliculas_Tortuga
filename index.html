<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporio de Peliculas Tortuga</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
         <h1>RESERVA TUS PELICULAS YA MISMO</h1>
    </header>
<main>
         <section id="add-movie">
           <h2>Añadir Nueva Pelicula</h2>
            <form id="movie-form"></form>
            <label for="titulo">Titulo</label>
            <input type="text" id="titulo" required>

            <label for="descripcion">Descripcion</label>
            <input type="text" id="descripcion" required>

            <label for="año">Año</label>
            <input type="text" id="anio" required>

            <label for="urlFoto">URL de la foto:</label>
            <input type="text" id="urlFoto" required>

            <label for="genero">Género:</label>
            <select id="genero" required>
               <option value="acción">Acción</option>
               <option value="terror">Terror</option> 
               <option value="comedia">Comedia</option>
               <option value="romance">Romance</option>  
            </select>

            <button type="submit">Guardar Película</button>
        </form>
  </section>

  <section id="movie-list">
    <!-- Aquí mostraremos la tabla de películas dinámicamente con JS -->
</section>
</main>
    <footer>
    <h2>Todos los derechos reservados</h2>
    </footer>
</body>
</html>
