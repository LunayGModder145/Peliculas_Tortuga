<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
         <h1>RESERVA TUS PELICULAS YA MISMO</h1>
    </header>
<main>
         <section id="PON PELICULA AQUI">
           <h2>MIRA LAS PELICULAS</h2>
            <form id>"Peliculas">
            <label for="name">Titulo</label>
            <input type="text" id="titulo" required>
            <label for="name">Descripcion</label>
            <input type="text" id="descripcion" required>
            <label for="name">Año</label>
            <input type="text" id="año" required>
            <label for="name">Genero</label>
            <input type="text" id="genero" required>
            <select id="CATEGORIAS" required
             <option value="TITULO">Terror
             <option value="TIPO">tipo
             <option value="AÑO">año
             <option value="GENERO">genero
            </select>
                <button type="submit">Buscar</button>
            </form>
        </section>
            
        
        
    </section>
</main>
    <footer>
    <h2>Todos los derechos reservados</h2>
    </footer>
</body>
</html>
